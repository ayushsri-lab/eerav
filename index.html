<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eerav's Fun Zone!</title>
<style>
  :root{
    --bg:#fff7ef;--card:#ffffff;--ink:#3a2f2a;--muted:#9a8b80;
    --good:#57c785;--good-soft:#e4f7ec;--bad:#ff9aa2;
    --shadow:0 6px 18px rgba(120,90,60,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:"Comic Sans MS","Chalkboard SE",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;user-select:none;}
  .wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  header.top h1{font-size:26px;margin:0;}
  .stars{background:#fff;border-radius:30px;padding:8px 16px;box-shadow:var(--shadow);font-size:22px;font-weight:800;color:#f4a017;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .tile{border:none;border-radius:26px;padding:24px 14px;cursor:pointer;box-shadow:var(--shadow);color:#fff;font-size:22px;font-weight:800;font-family:inherit;transition:transform .1s;text-align:center;}
  .tile:active{transform:scale(.95);}
  .tile .emo{font-size:50px;display:block;margin-bottom:8px;}
  .tile .lvl{font-size:14px;opacity:.9;display:block;margin-top:6px;font-weight:700;}
  .c1{background:#ff8fab;}.c2{background:#ffb703;}.c3{background:#8ecae6;}.c4{background:#95d5b2;}
  .c5{background:#b298dc;}.c6{background:#ffa552;}.c7{background:#7ec4cf;}
  .big1{background:#ff8fab;}.big2{background:#8ecae6;}.big3{background:#b298dc;}.big4{background:#95d5b2;}

  .card{background:var(--card);border-radius:28px;padding:20px;box-shadow:var(--shadow);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
  .backbtn{border:none;background:#fff0e0;border-radius:20px;padding:10px 18px;font-size:22px;cursor:pointer;font-family:inherit;font-weight:800;color:#a0754a;}
  .lvbadge{background:#efe6ff;color:#7a52c7;border-radius:20px;padding:10px 18px;font-size:18px;font-weight:800;}

  .qtext{text-align:center;font-size:28px;font-weight:800;margin:10px 0 4px;color:var(--muted);}
  .qbig{text-align:center;font-size:52px;font-weight:900;margin:14px 0 18px;letter-spacing:1px;min-height:64px;}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;}
  .choice{border:4px solid #ffe3c2;background:#fff;border-radius:24px;padding:24px 10px;font-size:40px;font-weight:900;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .08s;min-height:96px;display:flex;align-items:center;justify-content:center;}
  .choice:active{transform:scale(.94);}
  .choice.correct{background:var(--good-soft);border-color:var(--good);}
  .choice.wrong{background:#ffecec;border-color:var(--bad);animation:shake .3s;opacity:.6;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .nextbtn{display:none;width:100%;margin-top:18px;border:none;border-radius:26px;background:#57c785;color:#fff;font-size:28px;font-weight:900;padding:18px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .nextbtn:active{transform:scale(.97);}
  .nextbtn.show{display:block;}
  .actionbtn{border:none;border-radius:22px;background:#ffb703;color:#fff;font-size:22px;font-weight:800;padding:14px 22px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
  .actionbtn.green{background:#57c785;}
  .actionbtn:active{transform:scale(.96);}

  /* Reading */
  .story-pic{font-size:120px;text-align:center;margin:8px 0 4px;line-height:1;}
  .story-page-text{font-size:32px;font-weight:800;text-align:center;line-height:1.5;min-height:110px;padding:6px 4px;}
  .story-nav{display:flex;justify-content:space-between;gap:10px;margin-top:10px;align-items:center;}
  .pagedots{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .pagedots i{width:10px;height:10px;border-radius:50%;background:#e0d7cc;display:inline-block;}
  .pagedots i.on{background:#ffb703;transform:scale(1.3);}

  /* Puzzles - memory */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px;}
  .mcard{aspect-ratio:1/1;border-radius:18px;background:#8ecae6;display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;box-shadow:var(--shadow);transition:transform .1s;}
  .mcard.up{background:#fff;border:3px solid #ffd166;}
  .mcard.done{background:var(--good-soft);border:3px solid var(--good);}
  .mcard:active{transform:scale(.96);}
  .memrow{display:flex;justify-content:center;gap:16px;margin:16px 0;font-size:54px;min-height:64px;}

  /* Draw & color */
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
  .sw{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px #ddd;}
  .sw.sel{box-shadow:0 0 0 4px #333;transform:scale(1.1);}
  .tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .tbtn{border:none;background:#eee;border-radius:16px;padding:10px 16px;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;}
  .tbtn.on{background:#333;color:#fff;}
  #pad{width:100%;height:380px;background:#fff;border-radius:18px;border:3px solid #ffe3c2;touch-action:none;display:block;}
  .colorwrap svg{width:100%;height:auto;background:#fff;border-radius:18px;border:3px solid #ffe3c2;touch-action:manipulation;}
  .colorwrap .rg{stroke:#444;stroke-width:2;fill:#fff;cursor:pointer;}

  .celebrate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:50;}
  .celebrate.show{display:flex;}
  .celebrate .msg{font-size:44px;font-weight:900;color:#f4a017;background:#fff;padding:16px 30px;border-radius:30px;box-shadow:var(--shadow);}
  .confetti{position:fixed;top:-40px;font-size:34px;animation:fall 1.4s linear forwards;z-index:49;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🚀 Eerav's Fun Zone!</h1>
    <div class="stars">⭐ <span id="starN">0</span></div>
  </header>

  <!-- HOME -->
  <div id="home">
    <div class="grid">
      <button class="tile big1" onclick="show('mathHome')"><span class="emo">🧮</span>Math</button>
      <button class="tile big2" onclick="show('readingHome')"><span class="emo">📖</span>Reading</button>
      <button class="tile big3" onclick="show('puzzleHome')"><span class="emo">🧩</span>Puzzles</button>
      <button class="tile big4" onclick="show('drawHome')"><span class="emo">🎨</span>Draw & Color</button>
    </div>
  </div>

  <!-- MATH HOME -->
  <div id="mathHome" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('home')">🏠</button></div>
    <div class="grid" id="tiles"></div>
  </div>

  <!-- MATH GAME -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button class="backbtn" onclick="show('mathHome')">⬅️</button>
        <span class="lvbadge" id="lvBadge">Level 1</span>
      </div>
      <div class="qtext" id="qText"></div>
      <div class="qbig" id="qBig"></div>
      <div class="choices" id="qChoices"></div>
      <button class="nextbtn" id="nextBtn" onclick="nextQ()">Next ➡️</button>
    </div>
  </div>

  <!-- READING HOME -->
  <div id="readingHome" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('home')">🏠</button></div>
    <div class="grid" id="storyList"></div>
  </div>

  <!-- STORY -->
  <div id="story" class="hidden">
    <div class="card">
      <div class="toolbar"><button class="backbtn" onclick="show('readingHome')">⬅️ Books</button><span class="lvbadge" id="stTitle"></span></div>
      <div class="story-pic" id="stPic"></div>
      <div class="story-page-text" id="stText"></div>
      <div class="story-nav">
        <button class="actionbtn" onclick="pageBack()">⬅️</button>
        <span class="pagedots" id="pageDots"></span>
        <button class="actionbtn green" onclick="pageNext()">➡️</button>
      </div>
    </div>
  </div>

  <!-- PUZZLE HOME -->
  <div id="puzzleHome" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('home')">🏠</button></div>
    <div class="grid3">
      <button class="tile c3" onclick="startTwoDots()"><span class="emo">🔵</span>Two Dots</button>
      <button class="tile c1" onclick="startDotLink()"><span class="emo">🔗</span>Dot Link</button>
      <button class="tile c4" onclick="startLudo()"><span class="emo">🎲</span>Ludo</button>
      <button class="tile c5" onclick="startSnake()"><span class="emo">🐍</span>Snake & Ladder</button>
      <button class="tile c6" onclick="startJigsaw()"><span class="emo">🧩</span>Jigsaw</button>
      <button class="tile c2" onclick="startSlide()"><span class="emo">🔢</span>Slide</button>
      <button class="tile c7" onclick="startMemory()"><span class="emo">🃏</span>Memory</button>
      <button class="tile c1" onclick="startOdd()"><span class="emo">🔍</span>Odd One</button>
      <button class="tile c5" onclick="startMissing()"><span class="emo">❓</span>Missing</button>
      <button class="tile c4" onclick="startOrder()"><span class="emo">🔀</span>In Order</button>
    </div>
  </div>

  <!-- PUZZLE PLAY -->
  <div id="puzzle" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button class="backbtn" onclick="show('puzzleHome')">⬅️</button>
        <span class="lvbadge" id="pzTitle"></span>
      </div>
      <div class="qtext" id="pzText"></div>
      <div id="pzArea"></div>
    </div>
  </div>

  <!-- DRAW HOME -->
  <div id="drawHome" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('home')">🏠</button></div>
    <div class="grid3">
      <button class="tile c6" onclick="startDraw()"><span class="emo">✏️</span>Free Draw</button>
      <button class="tile c4" onclick="show('colorPick')"><span class="emo">🖍️</span>Color</button>
      <button class="tile c5" onclick="show('dotPick')"><span class="emo">🔗</span>Dot to Dot</button>
    </div>
  </div>

  <!-- DOT PICK -->
  <div id="dotPick" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('drawHome')">⬅️</button></div>
    <div class="grid3" id="dotPages"></div>
  </div>

  <!-- DOT PLAY -->
  <div id="dot" class="hidden">
    <div class="card">
      <div class="toolbar"><button class="backbtn" onclick="show('dotPick')">⬅️</button><span class="lvbadge" id="dotHint">Tap 1</span></div>
      <div class="qtext">Connect the dots in order!</div>
      <div class="colorwrap" id="dotArea"></div>
    </div>
  </div>

  <!-- FREE DRAW -->
  <div id="draw" class="hidden">
    <div class="card">
      <div class="toolbar"><button class="backbtn" onclick="show('drawHome')">⬅️</button></div>
      <div class="tools" id="brushTools"></div>
      <div class="palette" id="drawPalette"></div>
      <canvas id="pad"></canvas>
      <div class="tools" style="margin-top:12px">
        <button class="tbtn" onclick="clearPad()">🗑️ Clear</button>
      </div>
    </div>
  </div>

  <!-- COLOR PICK -->
  <div id="colorPick" class="hidden">
    <div class="toolbar"><button class="backbtn" onclick="show('drawHome')">⬅️</button></div>
    <div class="grid3" id="colorPages"></div>
  </div>

  <!-- COLOR PAGE -->
  <div id="color" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button class="backbtn" onclick="show('colorPick')">⬅️ Pictures</button>
        <button class="actionbtn green" onclick="colorDone()">⭐ Done!</button>
      </div>
      <div class="palette" id="colorPalette"></div>
      <div class="colorwrap" id="colorArea"></div>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate"><div class="msg" id="celMsg">⭐</div></div>

<script>
/* ============ helpers ============ */
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const S=x=>String(x);
const $=id=>document.getElementById(id);
const SECTIONS=['home','mathHome','game','readingHome','story','puzzleHome','puzzle','drawHome','draw','colorPick','color','dotPick','dot'];
function show(id){SECTIONS.forEach(s=>$(s).classList.toggle('hidden',s!==id));if(id==='mathHome')buildTiles();if(id==='readingHome')buildStoryList();if(id==='colorPick')buildColorPages();if(id==='dotPick')buildDotPages();if(id==='draw')setTimeout(initDraw,30);}

function numChoices(answer){
  const sp=Math.min(25,Math.max(3,Math.round(answer*0.2)));
  const set=new Set([answer]);let g=0;
  while(set.size<4&&g<120){let d=answer+rand(-sp,sp);if(d<0)d=Math.abs(d);if(d!==answer)set.add(d);g++;}
  let k=answer+1;while(set.size<4){set.add(k++);}
  return shuffle([...set]).map(v=>({label:S(v),value:S(v)}));
}

/* ============ progress ============ */
const KEY='eeravFunProgress_v1';
let PROG=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return d;}catch(e){}return{stars:0,levels:{}};}
function save(){localStorage.setItem(KEY,JSON.stringify(PROG));}
function refresh(){$('starN').textContent=PROG.stars;}
function addStar(n){PROG.stars+=(n||1);save();refresh();}

const OBJS=['🍎','🐟','⭐','🎈','🐶','🍓','🚗','🌸','🐥','🍌','🐝','🦋','🍇','🦄','🐱','🚀','🐸','🍉'];
const SHAPES=[['circle','⚫'],['square','🟥'],['triangle','🔺'],['star','⭐'],['heart','❤️'],['diamond','🔷'],['blue','🟦'],['green','🟢']];
const CORNERS=[['🔺',3],['🟥',4],['🔷',4],['🟦',4],['⭐',5]];

/* ============ MATH games (5-7 levels) ============ */
const MAXLV={add:7,subtract:7,missing:5,times:5,count:5,numbers:5,compare:5,shapes:4,patterns:5};
const GAMES={
  add(lv){
    let a,b,c=null;
    if(lv===1){a=rand(1,5);b=rand(1,5);}
    else if(lv===2){a=rand(3,9);b=rand(3,9);}
    else if(lv===3){a=rand(1,6);b=rand(1,6);c=rand(1,6);}
    else if(lv===4){a=rand(10,49);b=rand(1,9);}
    else if(lv===5){a=rand(11,59);b=rand(11,49);}
    else if(lv===6){a=rand(100,499);b=rand(10,89);}
    else{a=rand(100,599);b=rand(100,399);}
    const ans=a+b+(c||0);
    const big=c!=null?`${a} + ${b} + ${c} = ?`:`${a} + ${b} = ?`;
    return{text:'Add ➕',big,choices:numChoices(ans),answer:S(ans)};
  },
  subtract(lv){
    let a,b;
    if(lv===1){a=rand(3,9);b=rand(1,a-1);}
    else if(lv===2){a=rand(6,15);b=rand(1,a-1);}
    else if(lv===3){a=rand(11,19);b=rand(2,9);}
    else if(lv===4){a=rand(20,59);b=rand(1,9);}
    else if(lv===5){a=rand(30,79);b=rand(11,a-10);}
    else if(lv===6){a=rand(120,599);b=rand(20,99);}
    else{a=rand(300,899);b=rand(100,a-100);}
    const ans=a-b;
    return{text:'Take away ➖',big:`${a} − ${b} = ?`,choices:numChoices(ans),answer:S(ans)};
  },
  count(lv){
    let step,start;
    if(lv===1){step=1;start=rand(4,14);}
    else if(lv===2){step=2;start=rand(1,6)*2;}
    else if(lv===3){step=5;start=rand(1,5)*5;}
    else if(lv===4){step=10;start=rand(1,6)*10;}
    else{step=pick([2,5,10]);start=rand(2,7)*step;}
    const seq=[start,start+step,start+2*step];
    return{text:'What comes next?',big:`${seq.join('  ')}  ❓`,choices:numChoices(start+3*step),answer:S(start+3*step)};
  },
  numbers(lv){
    if(lv===1){const n=rand(3,19);return{text:'What comes after?',big:`${n}, ❓`,choices:numChoices(n+1),answer:S(n+1)};}
    if(lv===2){const n=rand(4,20);return{text:'What comes before?',big:`❓, ${n}`,choices:numChoices(n-1),answer:S(n-1)};}
    if(lv===3){const n=rand(4,18);return{text:'Missing number?',big:`${n}, ❓, ${n+2}`,choices:numChoices(n+1),answer:S(n+1)};}
    if(lv===4){const n=rand(10,40);return{text:'10 more?',big:`10 more than ${n}`,choices:numChoices(n+10),answer:S(n+10)};}
    const n=rand(20,50);return{text:'10 less?',big:`10 less than ${n}`,choices:numChoices(n-10),answer:S(n-10)};
  },
  compare(lv){
    const rng=lv<=2?10:lv===3?20:lv===4?50:99;
    let a=rand(1,rng),b=rand(1,rng);while(b===a)b=rand(1,rng);
    const bigger=(lv%2===1);
    const ans=bigger?(a>b?'A':'B'):(a<b?'A':'B');
    const choices=shuffle([{label:S(a),value:'A'},{label:S(b),value:'B'}]);
    return{text:bigger?'Which is more? ⬆️':'Which is less? ⬇️',big:'',choices,answer:ans};
  },
  shapes(lv){
    if(lv>=3){const s=pick(CORNERS);return{text:'How many corners?',big:`<span style="font-size:90px">${s[0]}</span>`,choices:numChoices(s[1]),answer:S(s[1])};}
    const set=lv<=1?SHAPES.slice(0,4):SHAPES;
    const target=pick(set),others=shuffle(set.filter(x=>x[0]!==target[0])).slice(0,3);
    const choices=shuffle([target,...others]).map(s=>({label:`<span style="font-size:56px">${s[1]}</span>`,value:s[0]}));
    return{text:'Match the shape!',big:`<span style="font-size:90px">${target[1]}</span>`,choices,answer:target[0]};
  },
  patterns(lv){
    const p=shuffle(OBJS).slice(0,3);let seq,next;
    if(lv===1){seq=[p[0],p[1],p[0],p[1]];next=p[0];}
    else if(lv===2){seq=[p[0],p[1],p[2],p[0],p[1]];next=p[2];}
    else if(lv===3){seq=[p[0],p[0],p[1],p[1],p[0],p[0]];next=p[1];}
    else if(lv===4){seq=[p[0],p[1],p[1],p[0],p[1],p[1]];next=p[0];}
    else{seq=[p[0],p[1],p[2],p[2],p[1],p[0],p[0],p[1]];next=p[2];}
    const vis=`${seq.map(x=>`<span style="font-size:40px">${x}</span>`).join(' ')} <span style="font-size:40px">❓</span>`;
    const opts=shuffle(p).map(x=>({label:`<span style="font-size:48px">${x}</span>`,value:x}));
    return{text:'What comes next?',big:vis,choices:opts,answer:next};
  },
  missing(lv){
    if(lv<=2){const rng=lv===1?10:20;const a=rand(1,rng-2);const ans=rand(1,rng-a);const c=a+ans;return{text:'Find the number',big:`${a} + ❓ = ${c}`,choices:numChoices(ans),answer:S(ans)};}
    if(lv===3){const b=rand(2,12);const ans=rand(1,12);const c=ans+b;return{text:'Find the number',big:`❓ + ${b} = ${c}`,choices:numChoices(ans),answer:S(ans)};}
    const a=lv===4?rand(10,20):rand(20,50);const ans=rand(2,9);const c=a-ans;return{text:'Find the number',big:`${a} − ❓ = ${c}`,choices:numChoices(ans),answer:S(ans)};
  },
  times(lv){
    let a,b;
    if(lv===1){a=2;b=rand(1,5);}
    else if(lv===2){a=rand(2,3);b=rand(1,6);}
    else if(lv===3){a=rand(2,5);b=rand(2,5);}
    else if(lv===4){a=rand(2,9);b=rand(2,6);}
    else{a=rand(2,10);b=rand(2,10);}
    return{text:'Times ✖️',big:`${a} × ${b} = ?`,choices:numChoices(a*b),answer:S(a*b)};
  }
};
const TILES=[
  {id:'add',emo:'➕',name:'Add',cls:'c3'},
  {id:'subtract',emo:'➖',name:'Take Away',cls:'c4'},
  {id:'missing',emo:'❔',name:'Missing #',cls:'c1'},
  {id:'times',emo:'✖️',name:'Times',cls:'c2'},
  {id:'count',emo:'🔢',name:'Skip Count',cls:'c1'},
  {id:'numbers',emo:'🔟',name:'Numbers',cls:'c2'},
  {id:'compare',emo:'⚖️',name:'More/Less',cls:'c5'},
  {id:'shapes',emo:'⭐',name:'Shapes',cls:'c6'},
  {id:'patterns',emo:'🎨',name:'Patterns',cls:'c7'}
];
let current=null,level=1,correctRow=0,answer=null,locked=false;

function answerQ(btn,val){
  if(locked)return;
  if(val===answer){
    locked=true;document.querySelectorAll('#qChoices .choice').forEach(b=>b.disabled=true);btn.classList.add('correct');

}

/* ---- Two Dots (join same-color dots) ---- */
const TD_COLORS=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'];
const TD_COLS=6,TD_ROWS=6;
let tdGrid=[],tdChain=[],tdPops=0,tdGoal=6;
function startTwoDots(){show('puzzle');$('pzTitle').textContent='🔵 Two Dots';tdPops=0;tdGoal=6;tdGrid=[];for(let i=0;i<TD_COLS*TD_ROWS;i++)tdGrid.push(rand(0,TD_COLORS.length-1));tdChain=[];renderTwoDots();}
function tdAdj(a,b){const ra=Math.floor(a/TD_COLS),ca=a%TD_COLS,rb=Math.floor(b/TD_COLS),cb=b%TD_COLS;return Math.abs(ra-rb)+Math.abs(ca-cb)===1;}
function renderTwoDots(){
  $('pzText').innerHTML=`Join dots of the same color!  ⭐ ${tdPops}/${tdGoal}`;
  const W=Math.min(330,window.innerWidth-70);
  let html=`<div style="display:grid;grid-template-columns:repeat(${TD_COLS},1fr);gap:8px;width:${W}px;margin:10px auto;">`;
  for(let i=0;i<tdGrid.length;i++){const on=tdChain.includes(i);html+=`<div data-i="${i}" style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;"><div style="width:${on?'82%':'66%'};height:${on?'82%':'66%'};border-radius:50%;background:${TD_COLORS[tdGrid[i]]};box-shadow:${on?'0 0 0 4px #333':'0 2px 4px rgba(0,0,0,.2)'};transition:all .1s;"></div></div>`;}
  html+=`</div><div class="tools"><button class="tbtn" style="font-size:20px" onclick="tdPop()">✨ Pop!</button><button class="tbtn" onclick="startTwoDots()">🔄 New</button></div>`;
  $('pzArea').innerHTML=html;
  $('pzArea').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>tdTap(+d.dataset.i));
}
function tdTap(i){
  if(tdChain.length===0){tdChain=[i];renderTwoDots();return;}
  const last=tdChain[tdChain.length-1];
  if(i===last){tdPop();return;}
  if(tdGrid[i]===tdGrid[tdChain[0]]&&tdAdj(i,last)&&!tdChain.includes(i)){tdChain.push(i);renderTwoDots();}
  else{tdChain=[i];renderTwoDots();}
}
function tdPop(){
  if(tdChain.length>=2){
    const removed=new Set(tdChain);
    for(let c=0;c<TD_COLS;c++){const keep=[];for(let r=TD_ROWS-1;r>=0;r--){const idx=r*TD_COLS+c;if(!removed.has(idx))keep.push(tdGrid[idx]);}while(keep.length<TD_ROWS)keep.push(rand(0,TD_COLORS.length-1));for(let r=TD_ROWS-1,k=0;r>=0;r--,k++)tdGrid[r*TD_COLS+c]=keep[k];}
    tdPops++;addStar();tdChain=[];
    if(tdPops>=tdGoal){renderTwoDots();celebrate('🎉 You win!');return;}
    celebrate();renderTwoDots();
  }else{tdChain=[];renderTwoDots();}
}

/* ---- Dot Link (connect matching dots) ---- */
const LINK_PUZZLES=[
  {n:4,pairs:[{c:'#e74c3c',a:[0,0],b:[0,3]},{c:'#3498db',a:[3,0],b:[3,3]},{c:'#2ecc71',a:[1,1],b:[2,2]}]},
  {n:5,pairs:[{c:'#e74c3c',a:[0,0],b:[4,0]},{c:'#3498db',a:[0,4],b:[4,4]},{c:'#f1c40f',a:[0,2],b:[4,2]},{c:'#2ecc71',a:[1,1],b:[3,1]},{c:'#9b59b6',a:[1,3],b:[3,3]}]},
  {n:5,pairs:[{c:'#e74c3c',a:[0,0],b:[4,2]},{c:'#3498db',a:[0,4],b:[2,2]},{c:'#2ecc71',a:[0,1],b:[1,3]}]}
];
let linkLevel=0,linkPuz,linkN,linkEnds,linkOwner,linkPaths,linkActive;
function startDotLink(){show('puzzle');$('pzTitle').textContent='🔗 Dot Link';linkLevel=0;loadLink(0);}
function loadLink(i){
  linkLevel=i%LINK_PUZZLES.length;linkPuz=LINK_PUZZLES[linkLevel];linkN=linkPuz.n;
  linkEnds={};linkOwner=new Array(linkN*linkN).fill(-1);linkPaths={};linkActive=-1;
  linkPuz.pairs.forEach((p,ci)=>{const a=p.a[0]*linkN+p.a[1],b=p.b[0]*linkN+p.b[1];linkEnds[ci]=[a,b];linkOwner[a]=ci;linkOwner[b]=ci;linkPaths[ci]=null;});
  renderLink();
}
function isEnd(ci,cell){return linkEnds[ci][0]===cell||linkEnds[ci][1]===cell;}
function linkAdj(a,b){const ra=Math.floor(a/linkN),ca=a%linkN,rb=Math.floor(b/linkN),cb=b%linkN;return Math.abs(ra-rb)+Math.abs(ca-cb)===1;}
function clearLinkColor(ci){const p=linkPaths[ci];if(p)p.forEach(c=>{if(!isEnd(ci,c))linkOwner[c]=-1;});linkPaths[ci]=null;}
function linkSolved(){for(const ci in linkEnds){const p=linkPaths[ci];if(!p||p.length<2)return false;const f=p[0],l=p[p.length-1],a=linkEnds[ci][0],b=linkEnds[ci][1];if(!((f===a&&l===b)||(f===b&&l===a)))return false;}return true;}
function linkTap(cell){
  let endColor=-1;for(const ci in linkEnds){if(isEnd(+ci,cell)){endColor=+ci;break;}}
  if(endColor>=0&&(linkActive!==endColor||linkPaths[endColor]===null||cell!==linkPaths[endColor][linkPaths[endColor].length-1])){
    clearLinkColor(endColor);linkActive=endColor;linkPaths[endColor]=[cell];renderLink();return;
  }
  if(linkActive<0)return;
  const path=linkPaths[linkActive],head=path[path.length-1];
  const idx=path.indexOf(cell);
  if(idx>=0){for(let k=idx+1;k<path.length;k++){if(!isEnd(linkActive,path[k]))linkOwner[path[k]]=-1;}linkPaths[linkActive]=path.slice(0,idx+1);renderLink();return;}
  if(!linkAdj(cell,head))return;
  const other=linkEnds[linkActive][0]===path[0]?linkEnds[linkActive][1]:linkEnds[linkActive][0];
  if(cell===other){path.push(cell);linkActive=-1;renderLink();if(linkSolved()){addStar(2);celebrate('🔗 Solved!');setTimeout(()=>loadLink(linkLevel+1),1100);}return;}
  if(linkOwner[cell]!==-1)return;
  path.push(cell);linkOwner[cell]=linkActive;renderLink();
}
function renderLink(){
  $('pzText').textContent='Connect the matching dots!';
  const W=Math.min(320,window.innerWidth-70);
  let html=`<div style="display:grid;grid-template-columns:repeat(${linkN},1fr);gap:5px;width:${W}px;margin:10px auto;">`;
  for(let i=0;i<linkN*linkN;i++){
    const o=linkOwner[i];let end=false;for(const ci in linkEnds){if(isEnd(+ci,i)){end=true;break;}}
    const col=o>=0?linkPuz.pairs[o].c:'#f3ece3';
    const bg=end?'#fff':(o>=0?col:'#f3ece3');
    const ring=(linkActive>=0&&o===linkActive)?'outline:3px solid #333;':'';
    html+=`<div data-i="${i}" style="aspect-ratio:1/1;border-radius:10px;background:${bg};${ring}display:flex;align-items:center;justify-content:center;cursor:pointer;">${end?`<div style="width:62%;height:62%;border-radius:50%;background:${col};"></div>`:''}</div>`;
  }
  html+=`</div><div class="tools"><button class="tbtn" onclick="loadLink(linkLevel)">🔄 Reset</button></div>`;
  $('pzArea').innerHTML=html;
  $('pzArea').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>linkTap(+d.dataset.i));
}

/* ---- Snakes & Ladders (vs robot) ---- */
const SL_L={2:15,5:14,9:21,18:29},SL_S={17:4,24:11,28:13,26:6},SL_MAX=30;
const DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
let slP,slC,slBusy,slDone,slMsg;
function startSnake(){show('puzzle');$('pzTitle').textContent='🐍 Snakes & Ladders';slP=1;slC=1;slBusy=false;slDone=false;slMsg='You 🔴 vs Robot 🔵 — tap 🎲!';renderSnake();}
function slApply(p){return SL_L[p]||SL_S[p]||p;}
function slMove(who){
  const die=rand(1,6);let pos=who==='p'?slP:slC;let np=pos+die;if(np>SL_MAX)np=SL_MAX;const after=slApply(np);
  let note=`${who==='p'?'You':'Robot'} rolled ${DICE[die-1]} → ${np}`;if(after>np)note+=' 🪜 up!';else if(after<np)note+=' 🐍 down!';
  if(who==='p')slP=after;else slC=after;slMsg=note;
  if(after>=SL_MAX){slDone=true;slMsg=who==='p'?'🎉 You WIN!':'🤖 Robot wins! Tap 🔄';if(who==='p')addStar(3),celebrate('🎉 You win!');}
  renderSnake();
}
function rollSnake(){if(slBusy||slDone)return;slBusy=true;slMove('p');if(slDone){slBusy=false;return;}setTimeout(()=>{if(!slDone)slMove('c');slBusy=false;},900);}
function renderSnake(){
  const R=6,C=5,cells=[];
  for(let dr=0;dr<R;dr++){const rfb=R-1-dr,base=rfb*C,nums=[];for(let c=0;c<C;c++)nums.push(base+c+1);if(rfb%2===1)nums.reverse();cells.push(...nums);}
  const W=Math.min(340,window.innerWidth-60);
  $('pzText').innerHTML=slMsg;
  let html=`<div style="display:grid;grid-template-columns:repeat(${C},1fr);gap:3px;width:${W}px;margin:8px auto;">`;
  cells.forEach(n=>{let mark=SL_L[n]?'🪜':SL_S[n]?'🐍':(n===SL_MAX?'🏁':'');let toks='';if(slP===n)toks+='🔴';if(slC===n)toks+='🔵';const bg=n===SL_MAX?'#ffe8a3':SL_L[n]?'#e4f7ec':SL_S[n]?'#ffecec':'#f3ece3';
    html+=`<div style="aspect-ratio:1/1;background:${bg};border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px;"><span style="position:absolute;top:1px;left:3px;font-size:11px;font-weight:800;color:#999">${n}</span>${mark}<span style="position:absolute;bottom:0;right:2px;font-size:15px">${toks}</span></div>`;});
  html+=`</div><div class="tools"><button class="tbtn" style="font-size:22px" onclick="rollSnake()">🎲 Roll</button><button class="tbtn" onclick="startSnake()">🔄 New</button></div>`;
  $('pzArea').innerHTML=html;
}

/* ---- Ludo Race (vs robot, roll 6 to start) ---- */
function ringPath(n){const p=[];for(let c=0;c<n;c++)p.push([0,c]);for(let r=1;r<n;r++)p.push([r,n-1]);for(let c=n-2;c>=0;c--)p.push([n-1,c]);for(let r=n-2;r>=1;r--)p.push([r,0]);return p;}
let luP,luC,luBusy,luDone,luMsg;
function startLudo(){show('puzzle');$('pzTitle').textContent='🎲 Ludo Race';luP=-1;luC=-1;luBusy=false;luDone=false;luMsg='Roll a 6 to start! 🔴 you · 🔵 robot';renderLudo();}
function luStep(who){
  const die=rand(1,6);let pos=who==='p'?luP:luC;let note=`${who==='p'?'You':'Robot'} rolled ${DICE[die-1]}`;
  if(pos<0){if(die===6){pos=0;note+=' — go! 🚀';}else note+=' — need a 6';}
  else{pos+=die;if(pos>=24){pos=24;note+=' — 🏁 home!';}}
  if(who==='p')luP=pos;else luC=pos;luMsg=note;
  if(pos>=24){luDone=true;luMsg=who==='p'?'🎉 You WIN!':'🤖 Robot wins! Tap 🔄';if(who==='p')addStar(3),celebrate('🎉 You win!');}
  renderLudo();
}
function rollLudo(){if(luBusy||luDone)return;luBusy=true;luStep('p');if(luDone){luBusy=false;return;}setTimeout(()=>{if(!luDone)luStep('c');luBusy=false;},900);}
function renderLudo(){
  const n=7,path=ringPath(n),W=Math.min(330,window.innerWidth-60),START_P=0,START_C=12;
  $('pzText').innerHTML=luMsg;
  const pidx={};path.forEach((p,i)=>pidx[p[0]*n+p[1]]=i);
  const tokens={};if(luP>=0&&luP<24)tokens[(START_P+luP)%24]='🔴';if(luC>=0&&luC<24)tokens[(START_C+luC)%24]=(tokens[(START_C+luC)%24]||'')+'🔵';
  let html=`<div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:3px;width:${W}px;margin:8px auto;">`;
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const key=r*n+c,i=pidx[key];
    if(i!==undefined){let bg=i===START_P?'#ffd6d6':i===START_C?'#d6e4ff':'#f3ece3';html+=`<div style="aspect-ratio:1/1;background:${bg};border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;">${tokens[i]||''}</div>`;}
    else if(r===3&&c===3){let fin='';if(luP>=24)fin+='🔴';if(luC>=24)fin+='🔵';html+=`<div style="aspect-ratio:1/1;background:#ffe8a3;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:19px;">${fin||'🏁'}</div>`;}
    else{let bg=r<3&&c<3?'#ffecec':r<3&&c>3?'#e8eeff':r>3&&c<3?'#eafbe9':r>3&&c>3?'#f3e8ff':'#fff';let t='';if(r===1&&c===1&&luP<0)t='🔴';if(r===1&&c===5&&luC<0)t='🔵';html+=`<div style="aspect-ratio:1/1;background:${bg};border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;">${t}</div>`;}
  }
  html+=`</div><div class="tools"><button class="tbtn" style="font-size:22px" onclick="rollLudo()">🎲 Roll</button><button class="tbtn" onclick="startLudo()">🔄 New</button></div>`;
  $('pzArea').innerHTML=html;
}

/* ---- Jigsaw (picture swap, 3x3 / 4x4) ---- */
let jigN=3;
function jigImage(){const c=document.createElement('canvas');c.width=300;c.height=300;const x=c.getContext('2d');x.fillStyle=pick(['#ffd166','#8ecae6','#95d5b2','#ff8fab','#b298dc','#ffa552','#7ec4cf']);x.fillRect(0,0,300,300);x.font='210px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(pick(['🦋','🚀','🐶','🐱','🌈','🐸','🦄','🍉','⭐','🐥','🚗','🌸','🐠','🦖']),150,168);return c.toDataURL();}
function isSolved(a){for(let i=0;i<a.length;i++)if(a[i]!==i)return false;return true;}
function startJigsaw(){show('puzzle');$('pzTitle').textContent='🧩 Jigsaw';renderJigsaw();}
function renderJigsaw(){
  const n=jigN,url=jigImage();let order=[...Array(n*n).keys()];do{order=shuffle(order);}while(isSolved(order));let sel=-1;
  $('pzText').textContent='Tap two pieces to swap them.';
  const W=Math.min(330,window.innerWidth-70);
  $('pzArea').innerHTML=`<div id="jig" style="display:grid;grid-template-columns:repeat(${n},1fr);gap:3px;width:${W}px;margin:10px auto;"></div><div class="tools"><button class="tbtn" onclick="jigN=3;renderJigsaw()">Easy 3×3</button><button class="tbtn" onclick="jigN=4;renderJigsaw()">Hard 4×4</button><button class="tbtn" onclick="renderJigsaw()">🔄 New</button></div>`;
  const grid=$('jig');
  function draw(){grid.innerHTML='';order.forEach((val,pos)=>{const r=Math.floor(val/n),col=val%n;const t=document.createElement('div');t.style.cssText=`aspect-ratio:1/1;background-image:url(${url});background-size:${n*100}% ${n*100}%;background-position:${n>1?col/(n-1)*100:0}% ${n>1?r/(n-1)*100:0}%;border:2px solid #fff;border-radius:8px;cursor:pointer;${pos===sel?'outline:4px solid #ffb703;':''}`;t.onclick=()=>{if(sel<0){sel=pos;draw();}else if(sel===pos){sel=-1;draw();}else{const tmp=order[sel];order[sel]=order[pos];order[pos]=tmp;sel=-1;draw();if(isSolved(order)){addStar(3);celebrate('🧩 Solved!');}}};grid.appendChild(t);});}
  draw();
}

/* ---- Slide (number sliding puzzle) ---- */
function neighbors(i,n){const r=Math.floor(i/n),c=i%n,res=[];if(r>0)res.push(i-n);if(r<n-1)res.push(i+n);if(c>0)res.push(i-1);if(c<n-1)res.push(i+1);return res;}
function slSolved(b){for(let i=0;i<b.length-1;i++)if(b[i]!==i+1)return false;return b[b.length-1]===0;}
function startSlide(){show('puzzle');$('pzTitle').textContent='🔢 Slide';renderSlide();}
function renderSlide(){
  const n=3;let b=[...Array(n*n).keys()];let blank=0;
  for(let i=0;i<220;i++){const m=pick(neighbors(blank,n));b[blank]=b[m];b[m]=0;blank=m;}
  $('pzText').textContent='Put 1 to 8 in order!';
  const W=Math.min(300,window.innerWidth-70);
  $('pzArea').innerHTML=`<div id="sld" style="display:grid;grid-template-columns:repeat(${n},1fr);gap:6px;width:${W}px;margin:10px auto;"></div><div class="tools"><button class="tbtn" onclick="renderSlide()">🔄 New</button></div>`;
  const grid=$('sld');
  function draw(){grid.innerHTML='';b.forEach((v,pos)=>{const t=document.createElement('div');if(v===0){t.style.cssText='aspect-ratio:1/1;';}else{t.textContent=v;t.style.cssText='aspect-ratio:1/1;background:#8ecae6;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;cursor:pointer;';t.onclick=()=>{const bl=b.indexOf(0);if(neighbors(pos,n).includes(bl)){b[bl]=v;b[pos]=0;draw();if(slSolved(b)){addStar(3);celebrate('🎉 Solved!');}}};}grid.appendChild(t);});}
  draw();
}

function initDraw(){canvas=$('pad');if(!canvas)return;ctx=canvas.getContext('2d');canvas.width=canvas.clientWidth;canvas.height=380;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.lineCap='round';ctx.lineJoin='round';bindDraw();}
function ptr(e){const r=canvas.getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)};}
function bindDraw(){
  if(canvas._bound)return;canvas._bound=true;
  const start=e=>{e.preventDefault();drawing=true;const p=ptr(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+0.1,p.y+0.1);ctx.strokeStyle=CUR;ctx.lineWidth=BRUSH;ctx.stroke();};
  const move=e=>{if(!drawing)return;e.preventDefault();const p=ptr(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=CUR;ctx.lineWidth=BRUSH;ctx.stroke();};
  const end=()=>{drawing=false;};
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',end);
}

  fish:[[55,150],[110,100],[160,85],[225,95],[260,150],[225,205],[160,215],[110,200]]
};
function buildDotPages(){const g=$('dotPages');g.innerHTML='';const items=[['star','⭐'],['square','🟦'],['triangle','🔺'],['house','🏠'],['boat','⛵'],['fish','🐟']];items.forEach(([id,emo])=>{const b=document.createElement('button');b.className='tile '+pick(['c1','c2','c3','c4','c5','c6','c7']);b.innerHTML=`<span class="emo">${emo}</span>`;b.onclick=()=>openDot(id);g.appendChild(b);});}
function dline(a,b){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#5b8def" stroke-width="4"/>`;}
function openDot(id){show('dot');const pts=DOTS[id];let next=0;const area=$('dotArea');
  function render(){
    let svg=`<svg viewBox="0 0 300 300" style="width:100%;max-width:360px;height:auto;display:block;margin:auto">`;
    for(let i=0;i<next-1;i++)svg+=dline(pts[i],pts[i+1]);
    if(next>=pts.length)svg+=dline(pts[pts.length-1],pts[0]);
    pts.forEach((p,i)=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="15" fill="${i<next?'#95d5b2':'#fff'}" stroke="#444" stroke-width="2" data-i="${i}" style="cursor:pointer"/><text x="${p[0]}" y="${p[1]+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#333" style="pointer-events:none">${i+1}</text>`;});
    svg+='</svg>';area.innerHTML=svg;
    area.querySelectorAll('circle').forEach(ci=>ci.onclick=()=>{if(+ci.dataset.i===next){next++;if(next>=pts.length){render();$('dotHint').textContent='Done! 🎉';addStar(2);celebrate('🔗 Great!');return;}render();}});
    $('dotHint').textContent=next>=pts.length?'Done! 🎉':('Tap '+(next+1));
  }
  render();
}

/* ============ celebrate ============ */
const CELS=['⭐ Yay! ⭐','🎉 Great! 🎉','👏 Nice! 👏','🌟 Wow! 🌟','😃 Yes! 😃','🔥 Cool! 🔥'];
function celebrate(msg){
  const c=$('celebrate');$('celMsg').textContent=msg||pick(CELS);c.classList.add('show');
  for(let i=0;i<14;i++){const e=document.createElement('div');e.className='confetti';e.textContent=pick(['⭐','🎉','🌈','✨','🎈','💛']);e.style.left=rand(2,96)+'vw';e.style.animationDelay=(Math.random()*0.4)+'s';e.style.fontSize=rand(24,44)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
  setTimeout(()=>c.classList.remove('show'),1100);
}

/* ============ init ============ */
refresh();show('home');
</script>
